<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bone Brigade Toon Town</title>
  <meta name="description" content="Levels, gear, and professions for the Bone Brigade's WoW Forever characters.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="title">Bone Brigade Toon Town</h1>
        <p class="sub" id="updated">Loading…</p>
      </div>
    </header>

    <div id="leaders" class="leaders"></div>

    <div class="table-wrap">
      <table id="roster">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden></p>

    <footer>
      Data comes from the public WoW Forever Armory, which updates when a character logs out.
      New characters show up after level 10. Click a character for gear and professions.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
